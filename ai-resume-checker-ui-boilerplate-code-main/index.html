<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title & SEO Meta Tags -->
    <title>AI Resume Tracker - ATS Score &amp; Resume Optimizer</title>
    <meta
      name="description"
      content="AI Resume Tracker scores your resume against modern ATS criteria, identifies fixable gaps, generates impactful bullet rewrites, and tracks progress across versions."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Resume Tracker" />
    <meta property="og:title" content="AI Resume Tracker - ATS Score &amp; Resume Optimizer" />
    <meta
      property="og:description"
      content="Beat the ATS and land more interviews with instant AI-powered resume scoring, keyword optimization, and version tracking."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Resume Tracker - ATS Score &amp; Resume Optimizer" />
    <meta
      name="twitter:description"
      content="Beat the ATS and land more interviews with instant AI-powered resume scoring, keyword optimization, and version tracking."
    />

    <!-- Performance: Preconnect & Load Fonts (Inter + Geist) without CSS @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
